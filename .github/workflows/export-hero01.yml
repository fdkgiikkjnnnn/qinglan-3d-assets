name: Export Hero01 T-Pose

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-hero01.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify T-pose assets
        run: |
          test -f models/hero01/hero01_tpose_shape.glb
          test -f refs/hero01_tpose_ref.png
          ls -lh models/hero01/hero01_tpose_shape.glb refs/hero01_tpose_ref.png
      - name: Upload T-pose artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero01-tpose
          path: |
            models/hero01/hero01_tpose_shape.glb
            refs/hero01_tpose_ref.png
          compression-level: 0
          retention-days: 1
