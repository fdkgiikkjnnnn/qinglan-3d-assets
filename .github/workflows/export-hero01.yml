name: Export Hero01 GLB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-hero01.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Hero01 cloud assets
        run: |
          test -f models/hero01/hero01_cloud_shape.glb
          test -f refs/hero01_cloud_ref.png
          ls -lh models/hero01/hero01_cloud_shape.glb refs/hero01_cloud_ref.png
      - name: Upload Hero01 cloud artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero01-cloud
          path: |
            models/hero01/hero01_cloud_shape.glb
            refs/hero01_cloud_ref.png
          compression-level: 0
          retention-days: 1
