name: Verify Hero01 Rigged GLB

on:
  push:
    branches: [main]
    paths:
      - "models/hero01/hero01_rigged_animated.glb"
      - ".github/workflows/verify-hero01-rig.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GLB structure
        run: |
          python - <<'PY'
          import json,struct
          p="models/hero01/hero01_rigged_animated.glb"
          data=open(p,"rb").read()
          magic,ver,total=struct.unpack_from("<4sII",data,0)
          assert magic==b"glTF" and ver==2 and total==len(data),(magic,ver,total,len(data))
          n,typ=struct.unpack_from("<I4s",data,12)
          assert typ==b"JSON"
          doc=json.loads(data[20:20+n].decode("utf-8").rstrip(" \t\r\n\0"))
          anim=[a.get("name","") for a in doc.get("animations",[])]
          skins=doc.get("skins",[])
          nodes=doc.get("nodes",[])
          names=[n.get("name","") for n in nodes]
          required={"Idle","Run","Attack"}
          assert required.issubset(set(anim)),f"animations={anim}"
          assert skins,f"no skins; animations={anim}"
          joints=sum(len(s.get("joints",[])) for s in skins)
          assert joints>=10,f"too few joints {joints}"
          assert "Sword_Blade" in names,f"Sword_Blade missing: {names[-30:]}"
          print("PASS Hero01 rigged GLB")
          print("bytes",len(data))
          print("animations",anim)
          print("skins",len(skins),"joints",joints)
          print("nodes",len(nodes),"Sword_Blade",names.index("Sword_Blade"))
          PY
