name: Hero01 T-Pose Shape

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hero01-tpose-textured.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install clients
        run: python -m pip install --upgrade "gradio_client>=1.3,<2" pillow

      - name: Generate T-pose reference and GLB
        run: |
          python - <<'PY'
          import pathlib, shutil
          from PIL import Image
          from gradio_client import Client, handle_file

          refs = pathlib.Path("refs")
          models = pathlib.Path("models/hero01")
          refs.mkdir(parents=True, exist_ok=True)
          models.mkdir(parents=True, exist_ok=True)

          prompt = (
              "professional 3D game character rigging reference, single full body front orthographic view, "
              "24 year old East Asian male xianxia sword cultivator, elegant realistic adult male, tall slender athletic normal proportions, "
              "long straight black hair with half-up high topknot and pale jade hair ribbon, refined calm face, "
              "white moon-white long outer robe, blue-gray inner robe, black waist belt, subtle jade ornament, black boots, "
              "Chinese xianxia design, high detail realistic AAA game character concept. "
              "EXACT T-POSE FOR RIGGING: BOTH ARMS STRAIGHT OUT HORIZONTALLY LEFT AND RIGHT AT SHOULDER HEIGHT, "
              "arms forming a perfect letter T, elbows straight, hands open and empty, palms down, fingers visible, "
              "large clear air gaps between both sleeves and torso, legs slightly apart and straight. "
              "NO sword, NO weapon, NO prop, NO scenery, NO cape crossing the arms, NO crossed arms, NO bent arms. "
              "pure white seamless background, even studio light, centered, entire head hair hands robe boots fully visible, no text"
          )

          flux = Client("black-forest-labs/FLUX.1-schnell")
          result = flux.predict(
              prompt=prompt,
              seed=97531,
              randomize_seed=False,
              width=1024,
              height=1024,
              num_inference_steps=4,
              api_name="/infer",
          )
          image_path = result[0] if isinstance(result, (tuple, list)) else result
          if isinstance(image_path, dict):
              image_path = image_path.get("path") or image_path.get("value")
          image_path = pathlib.Path(str(image_path))
          ref = refs / "hero01_tpose_ref.png"
          with Image.open(image_path) as im:
              im.convert("RGB").save(ref, "PNG")
          print("Reference:", ref, ref.stat().st_size)

          client = Client("WorldzTech/Hunyuan3D-2.1-Demo")
          result = client.predict(
              image=handle_file(str(ref)),
              textured=False,
              steps=30,
              guidance_scale=5.0,
              octree_resolution=256,
              seed=86420,
              randomize_seed=False,
              remove_background=True,
              api_name="/generate",
          )
          print("Hunyuan shape result:", result)

          candidate = result[0] if isinstance(result, (tuple, list)) else result
          if isinstance(candidate, dict):
              candidate = candidate.get("path") or candidate.get("value")
          if hasattr(candidate, "name"):
              candidate = candidate.name
          p = pathlib.Path(str(candidate))
          if not p.exists():
              raise SystemExit(f"Generated model missing: {candidate!r}")

          target = models / "hero01_tpose_shape.glb"
          shutil.copy2(p, target)
          if target.stat().st_size < 10000:
              raise SystemExit("Generated GLB too small")
          print("Model:", target, target.stat().st_size)
          PY

      - name: Commit Hero01 T-pose assets
        run: |
          git config user.name "qinglan-3d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add refs/hero01_tpose_ref.png models/hero01/hero01_tpose_textured.glb
          git diff --cached --quiet && exit 0
          git commit -m "asset: generate Hero01 T-pose GLB"
          git push
