name: Hero01 Official Hunyuan3D2 Textured

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hero01-official-texture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  texture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --upgrade "gradio_client>=1.3,<2"
      - name: Generate official textured Hero01
        run: |
          python - <<'PY'
          import pathlib, shutil, traceback
          from gradio_client import Client, handle_file

          src = pathlib.Path("refs/hero01_tpose_ref.png")
          outdir = pathlib.Path("models/hero01")
          outdir.mkdir(parents=True, exist_ok=True)
          target = outdir / "hero01_tpose_textured_official.glb"

          c = Client("tencent/Hunyuan3D-2")
          api = c.view_api(return_format="dict")
          print("API keys:", list(api.get("named_endpoints", {}).keys()))

          candidates = ["/generation_all", "/generate_all", "/generation-all"]
          endpoint = next((x for x in candidates if x in api.get("named_endpoints", {})), None)
          if not endpoint:
              for name, spec in api.get("named_endpoints", {}).items():
                  params=[p.get("parameter_name","") for p in spec.get("parameters",[])]
                  if "image" in params and len(spec.get("returns",[])) >= 2:
                      endpoint=name; break
          if not endpoint:
              raise SystemExit("No textured-generation endpoint found")

          spec=api["named_endpoints"][endpoint]
          param_names=[p.get("parameter_name","") for p in spec.get("parameters",[])]
          print("Using", endpoint, param_names)

          vals = {
            "caption": None,
            "image": handle_file(str(src)),
            "mv_image_front": None,
            "mv_image_back": None,
            "mv_image_left": None,
            "mv_image_right": None,
            "steps": 20,
            "guidance_scale": 5.0,
            "seed": 13579,
            "octree_resolution": 256,
            "check_box_rembg": True,
            "num_chunks": 8000,
            "randomize_seed": False,
          }
          kwargs={k:v for k,v in vals.items() if k in param_names}
          print("kwargs", {k:("<file>" if k=="image" else v) for k,v in kwargs.items()})
          result=c.predict(api_name=endpoint, **kwargs)
          print("RESULT", result)

          items=list(result) if isinstance(result,(tuple,list)) else [result]
          paths=[]
          for item in items:
              if isinstance(item,dict):
                  item=item.get("path") or item.get("value")
              if hasattr(item,"name"): item=item.name
              if isinstance(item,str) and pathlib.Path(item).exists():
                  paths.append(pathlib.Path(item))
          print("downloaded paths",paths)
          glbs=[p for p in paths if p.suffix.lower()==".glb"]
          if not glbs:
              raise SystemExit("No GLB returned")
          # textured output is normally the second GLB; otherwise choose largest GLB.
          chosen=glbs[-1] if len(glbs)>1 else max(glbs,key=lambda p:p.stat().st_size)
          shutil.copy2(chosen,target)
          print("Saved",target,target.stat().st_size)
          if target.stat().st_size < 100000:
              raise SystemExit("Textured GLB unexpectedly small")
          PY
      - name: Commit textured model
        run: |
          git config user.name "qinglan-3d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add models/hero01/hero01_tpose_textured_official.glb
          git diff --cached --quiet && exit 0
          git commit -m "asset: add official textured Hero01 T-pose GLB"
          git push
