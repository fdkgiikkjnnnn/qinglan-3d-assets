name: Rig Hero01 with UniRig

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hero01-unirig.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Gradio client
        run: python -m pip install --upgrade "gradio_client>=1.3,<2"

      - name: Auto-rig Hero01 T-pose
        run: |
          python - <<'PY'
          import pathlib, shutil
          from gradio_client import Client, handle_file

          url = "https://raw.githubusercontent.com/fdkgiikkjnnnn/qinglan-3d-assets/main/models/hero01/hero01_tpose_shape.glb"
          outdir = pathlib.Path("models/hero01")
          outdir.mkdir(parents=True, exist_ok=True)
          target = outdir / "hero01_tpose_rigged.glb"

          c = Client("jasongzy/UniRig")
          result = c.predict(
              input_path=handle_file(url),
              output_format="glb",
              api_name="/process_pipeline",
          )
          print("UniRig result:", result)

          candidate = result
          if isinstance(candidate, (tuple, list)):
              candidate = candidate[0] if candidate else None
          if isinstance(candidate, dict):
              candidate = candidate.get("path") or candidate.get("value")
          if hasattr(candidate, "name"):
              candidate = candidate.name

          p = pathlib.Path(str(candidate)) if candidate else None
          if not p or not p.exists():
              raise SystemExit(f"UniRig returned no usable rigged file: {candidate!r}")
          shutil.copy2(p, target)
          print("Saved", target, target.stat().st_size)
          if target.stat().st_size < 10000:
              raise SystemExit("Rigged GLB unexpectedly small")
          PY

      - name: Commit rigged Hero01
        run: |
          git config user.name "qinglan-3d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add models/hero01/hero01_tpose_rigged.glb
          git diff --cached --quiet && exit 0
          git commit -m "asset: auto-rig Hero01 T-pose with UniRig"
          git push
