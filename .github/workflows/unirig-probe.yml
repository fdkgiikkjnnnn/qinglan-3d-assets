name: Probe UniRig API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unirig-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install Gradio client
        run: python -m pip install --upgrade "gradio_client>=1.3,<2"
      - name: Probe UniRig Space API
        run: |
          python - <<'PY'
          from gradio_client import Client
          spaces = ["jasongzy/UniRig", "MajorDaniel/UniRig", "camenduru/UniRig"]
          for name in spaces:
              try:
                  print("\n===", name, "===")
                  c = Client(name)
                  api = c.view_api(return_format="dict")
                  print(api)
              except Exception as e:
                  print("ERROR", repr(e))
          PY
